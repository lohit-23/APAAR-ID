services:
  # Backend FastAPI Web Service
  - type: web
    name: shikshasetu-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        value: https://sznupbyahmpgtfcmaqul.supabase.co
      - key: SUPABASE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6bnVwYnlhaG1wZ3RmY21hcXVsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MzExMDc2MSwiZXhwIjoyMTA4Njg2NzYxfQ.sADuX7Ksw15X8bgOocguPhRTrW6MjUpXkKCdXjWaj7w
      - key: SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6bnVwYnlhaG1wZ3RmY21hcXVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTA3NjEsImV4cCI6MjEwODY4Njc2MX0.Kfu2EZw1vYxO9i1WV2MmI3cffxd8ys9Bu0Q6-dvRWLg
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: '["*"]'

  # Frontend React Static Site
  - type: static
    name: shikshasetu-ui
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://sznupbyahmpgtfcmaqul.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN6bnVwYnlhaG1wZ3RmY21hcXVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTA3NjEsImV4cCI6MjEwODY4Njc2MX0.Kfu2EZw1vYxO9i1WV2MmI3cffxd8ys9Bu0Q6-dvRWLg
      - key: VITE_PROTOTYPE_MODE
        value: production
